<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recital Booklet</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #faf7f2;
      --warm-white: #fffef9;
      --ink: #1a1612;
      --gold: #c9a84c;
      --gold-light: #e8d5a3;
      --muted: #8a7f72;
      --page-max: 680px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0c0a;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-screen Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: #0e0c0a;
      z-index: 200;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.25s ease;
    }

    #lightbox.open { display: flex; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #lightbox img {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      transition: opacity 0.18s ease;
    }

    #lightbox-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: none;
      border: none;
      color: rgba(232,213,163,0.7);
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
      z-index: 10;
      transition: color 0.2s;
    }

    #lightbox-close:hover { color: #fff; }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(232,213,163,0.55);
      font-size: 52px;
      font-weight: 200;
      cursor: pointer;
      padding: 0 20px;
      line-height: 1;
      z-index: 10;
      transition: color 0.2s;
      user-select: none;
    }

    .lb-nav:hover { color: var(--gold); }

    #lb-prev { left: 0; }
    #lb-next { right: 0; }

    #lb-counter {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(232,213,163,0.5);
    }

  </style>
</head>
<body>

  <!-- Full-screen Lightbox -->
  <div id="lightbox">
    <button id="lightbox-close" aria-label="Close">×</button>
    <button id="lb-prev" class="lb-nav" aria-label="Previous">&#8249;</button>
    <img id="lightbox-img" src="" alt="Booklet page" />
    <button id="lb-next" class="lb-nav" aria-label="Next">&#8250;</button>
    <div id="lb-counter"></div>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────
    // ADD YOUR IMAGE URLs BELOW
    // Each entry is the direct URL to one page of your booklet.
    // They will be displayed in the order listed.
    // Example:
    //   "https://i.imgur.com/abc123.jpg",
    //   "https://drive.google.com/uc?id=FILE_ID",
    // ─────────────────────────────────────────────────────────────
    const PAGES = [
      "Jeanne%20Zac%20Recital%20Booklet.jpg",
      // Add more URLs here...
    ];
    // ─────────────────────────────────────────────────────────────

    const lightbox   = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const n = PAGES.length;

    let current = 0;

    function openLightbox(index) {
      current = index;
      lightboxImg.src = PAGES[current];
      updateNav();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function updateNav() {
      document.getElementById('lb-counter').textContent = `${current + 1} / ${n}`;
      document.getElementById('lb-prev').style.visibility = current > 0 ? 'visible' : 'hidden';
      document.getElementById('lb-next').style.visibility = current < n - 1 ? 'visible' : 'hidden';
    }

    function prev() { if (current > 0) { current--; lightboxImg.src = PAGES[current]; updateNav(); } }
    function next() { if (current < n - 1) { current++; lightboxImg.src = PAGES[current]; updateNav(); } }

    //document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); prev(); });
    //document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); next(); });
    //document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    //lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => {
      //if (e.key === 'Escape')       closeLightbox();
      //if (e.key === 'ArrowRight')   next();
      //if (e.key === 'ArrowLeft')    prev();
    });

    // Swipe support
    let touchStartX = 0;
    lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
    });

    // Open on first page automatically
    if (n > 0) openLightbox(0);
  </script>
</body>
</html>
